[package]
name = "imperecta_core"
version = "0.1.0"
edition = "2021"
description = "Imperecta extraction core: price/currency parsing, JSON-LD product extraction, data-quality assessment"
license = "UNLICENSED"
publish = false

[lib]
name = "imperecta_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.26", features = ["extension-module", "abi3-py312"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
scraper = "0.27.0"
quick-xml = "0.42"
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
