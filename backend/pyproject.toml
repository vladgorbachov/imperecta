[project]
name = "imperecta-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "venv", "__pycache__", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures carry long literals (URLs, signed payloads, expected
# messages); everything else (F, I, N, unused code) still applies.
"tests/**" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole session: the app's module-level async engine
# pools asyncpg connections bound to the loop that first used them —
# per-test loops (the pytest-asyncio 1.x default) hit "Future attached to a
# different loop" on every test that shares that engine.
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = [
    "integration: tests that need PostgreSQL and/or real network fetches",
]

[tool.coverage.run]
source = ["app/modules/scraper"]
omit = [
    "**/proxy_manager.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 95
