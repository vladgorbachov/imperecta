[package]
name = "imperecta_data_ops"
version = "0.1.0"
edition = "2021"
description = "Imperecta data-ops read-path service (P6 cross-shop price comparison)"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "macros",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rayon = "1"
memchr = "2"
arc-swap = "1"
base64 = "0.22"

[profile.release]
lto = true
strip = true
