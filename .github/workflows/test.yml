name: Tests

# Backend unit tests run in ci.yml (backend-test, DB-free suite). This
# workflow keeps only the live E2E smoke against the deployed frontend/API.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  e2e-smoke:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Install Playwright
        run: npx playwright install chromium
      - name: Run smoke tests
        env:
          BASE_URL: https://imperecta.pages.dev
          API_URL: https://imperecta-production.up.railway.app
        run: npx playwright test tests/smoke.spec.ts
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: e2e/test-results/
